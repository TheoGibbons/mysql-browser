# The marketing site only. The desktop application itself is not a service and
# is not built here — it ships as a Windows installer from GitHub Releases.
#
# Proxy-agnostic on purpose: no Traefik labels, no external network, no
# hostname and no TLS. `docker compose up -d --build` works on a machine that
# has never heard of hobby-traefik.
name: mysql-browser-site

services:
  site:
    build:
      context: ./site
    restart: unless-stopped
    expose:
      - '80'
    # 127.0.0.1, not localhost: busybox wget tries the ::1 record first and
    # nginx listens on IPv4 only, so `localhost` is a guaranteed refusal.
    #
    # Traefik routes only to a healthy container, so these timings are what make
    # a LIVE deploy seamless (scripts/deploy.sh). start_interval probes every
    # second while booting, so a new release takes traffic as soon as it answers.
    # The short interval and the /tmp/drain check let a deploy take the outgoing
    # release out of rotation within 15 seconds, before it is stopped.
    healthcheck:
      test: ['CMD-SHELL', 'test ! -f /tmp/drain && wget --spider -q http://127.0.0.1/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

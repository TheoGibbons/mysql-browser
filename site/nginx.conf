server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compose's health check hits this. It must not depend on the site's files
    # existing, so a broken build fails as "unhealthy" rather than as a 200.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The download button reads api.github.com at page load, so connect-src has
    # to allow it. Everything else is same-origin or inline style/script, which
    # is all this page uses.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}

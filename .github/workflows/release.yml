# Builds the Windows installer and publishes it to GitHub Releases.
#
# The release it produces is what BOTH consumers read:
#   - the marketing site's download button, via the releases API
#   - the installed app's auto-updater, via the latest.yml that
#     electron-builder uploads alongside the .exe
#
# Driven by tags, not by pushes to main, so the version in package.json is the
# thing that decides what a release is called.
name: Release Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: mysql-browser-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # electron-builder creates the release and uploads assets

jobs:
  build:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
      id-token: write # Azure login uses GitHub OIDC; no client secret or PFX.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # electron-builder names the installer and writes latest.yml from the
      # version in package.json, while the release is named after the tag. If
      # they disagree, the release reads v0.2.0 and the updater still offers
      # 0.1.0, which is confusing in exactly the place nobody looks. Fail here
      # instead, before anything is built.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [[ "$tag" != "$pkg" ]]; then
            echo "Tag $GITHUB_REF_NAME implies version $tag but package.json says $pkg." >&2
            echo "Bump package.json, commit, then retag." >&2
            exit 1
          fi
          echo "Releasing version $pkg"

      - name: Typecheck
        run: npm run typecheck

      - name: Authenticate to Azure for signing
        uses: azure/login@v3
        with:
          # Public identifiers for mysql-browser-github; authentication uses OIDC.
          client-id: a0a0a7c6-d822-454a-b06b-3364b60f9893
          tenant-id: ed7b52d5-a4f8-4c29-bed1-b5c6cf7655dd
          subscription-id: 99f62251-76d3-40ec-9bb3-70857da462f6

      # Same module used by azure/artifact-signing-action@v2. Calling it from
      # electron-builder's signing hook also signs the app and NSIS uninstaller
      # before packaging, and the installer before updater hashes are generated.
      - name: Install Azure Artifact Signing tools
        shell: pwsh
        run: |
          Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery -Scope CurrentUser

      # Tag refs publish, including a manual run that selects a v* tag.
      # Manual branch runs sign and verify without publishing; download those
      # installers from the workflow artifact below.
      - name: Build, sign, verify, and publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Build, sign, and verify without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:installer -- --config scripts/electron-builder-release.cjs --publish never

      # The only way to get at a dispatch build, and a useful record of a
      # tagged one.
      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: mysql-browser-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
